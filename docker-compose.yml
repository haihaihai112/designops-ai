services:
  interiorforge:
    build: .
    container_name: interiorforge-ai
    env_file:
      - .env
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:7860"
    volumes:
      - ./outputs:/app/outputs
      - ./module2_rag/chroma_db:/app/module2_rag/chroma_db
    restart: unless-stopped
