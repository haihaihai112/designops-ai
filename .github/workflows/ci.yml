name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python -m compileall -q module2_rag module3_agent module4_demo module5_ops module6_observability module7_api
      - run: AUTO_BUILD_KNOWLEDGE_BASE=0 python -m module5_ops.evaluation --output-dir /tmp/interiorforge-eval --min-parse-accuracy 95 --min-constraint-coverage 95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
